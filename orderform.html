<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Form Validation</title>
    <link href="https://code.jquery.com/ui/1.10.4/themes/ui-lightness/jquery-ui.css" rel="stylesheet">
    <link href="orderform.css" rel="stylesheet">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
    <script>
      $(document).ready(function () {
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        const zipPattern = /^\d{5}$/;

        $('#order').submit(function (event) {
          const name = $('#name').val().trim();
          const address = $('#address').val().trim();
          const city = $('#city').val().trim();
          const shipAddress = $('#shipaddr').val().trim();
          const shipCity = $('#shipcity').val().trim();
          const shipZip = $('#shipzip').val().trim();
          const zip = $('#zip').val().trim();
          const email = $('#email').val().trim();
          const confirmEmail = $('#email2').val().trim();

          if (name === '') {
            event.preventDefault();
            $('#nameErr').text('Please enter a name.');
            $('#name').focus();
            return false;
          }

          if (address === '') {
            event.preventDefault();
            $('#addressErr').text('Please enter a billing address.');
            $('#address').focus();
            return false;
          }

          if (city === '') {
            event.preventDefault();
            $('#cityErr').text('Please enter a city.');
            $('#city').focus();
            return false;
          }

          if (shipAddress === '') {
            event.preventDefault();
            $('#shipaddrErr').text('Please enter a shipping address.');
            $('#shipaddr').focus();
            return false;
          }

          if (shipCity === '') {
            event.preventDefault();
            $('#shipcityErr').text('Please enter a shipping city.');
            $('#shipcity').focus();
            return false;
          }

          if (shipZip === '') {
            event.preventDefault();
            $('#shipzipErr').text('Please enter a shipping zip code.');
            $('#shipzip').focus();
            return false;
          }

          if (!zipPattern.test(shipZip)) {
            event.preventDefault();
            $('#shipzipErr').text('Please enter a 5-digit shipping zip code.');
            $('#shipzip').focus();
            return false;
          }

          if (zip === '') {
            event.preventDefault();
            $('#zipErr').text('Please enter a zip code.');
            $('#zip').focus();
            return false;
          }

          if (!zipPattern.test(zip)) {
            event.preventDefault();
            $('#zipErr').text('Please enter a 5-digit zip code.');
            $('#zip').focus();
            return false;
          }

          if (email === '') {
            event.preventDefault();
            $('#emailErr').text('Please enter an email address.');
            $('#email').focus();
            return false;
          }

          if (!emailPattern.test(email)) {
            event.preventDefault();
            $('#emailErr').text('Please enter a valid email address.');
            $('#email').focus();
            return false;
          }

          if (confirmEmail === '') {
            event.preventDefault();
            $('#email2Err').text('Please confirm your email address.');
            $('#email2').focus();
            return false;
          }

          if (confirmEmail !== email) {
            event.preventDefault();
            $('#email2Err').text('Email addresses do not match.');
            $('#email2').focus();
            return false;
          }

          $('#name').val(name);
          $('#address').val(address);
          $('#city').val(city);
          $('#shipaddr').val(shipAddress);
          $('#shipcity').val(shipCity);
          $('#shipzip').val(shipZip);
          $('#zip').val(zip);
          $('#email').val(email);
          $('#email2').val(confirmEmail);
          $('#nameErr').text('');
          $('#addressErr').text('');
          $('#cityErr').text('');
          $('#shipaddrErr').text('');
          $('#shipcityErr').text('');
          $('#shipzipErr').text('');
          $('#zipErr').text('');
          $('#emailErr').text('');
          $('#email2Err').text('');
          event.preventDefault();
          window.location.href = 'thanks.html';
        });

        $('#name, #address, #city, #shipaddr, #shipcity, #shipzip, #zip, #email, #email2').on('input', function () {
          if ($(this).val().trim() !== '') {
            if (this.id === 'zip' || this.id === 'shipzip') {
              if (zipPattern.test($(this).val().trim())) {
                $('#' + this.id + 'Err').text('');
              }
            } else if (this.id === 'email') {
              if (emailPattern.test($(this).val().trim())) {
                $('#emailErr').text('');
                if ($('#email2').val().trim() === $(this).val().trim()) {
                  $('#email2Err').text('');
                }
              }
            } else if (this.id === 'email2') {
              if ($(this).val().trim() === $('#email').val().trim()) {
                $('#email2Err').text('');
              }
            } else {
              $('#' + this.id + 'Err').text('');
            }
          }
        });

        $('#name, #address, #city, #shipaddr, #shipcity, #shipzip, #zip, #email, #email2').on('blur', function () {
          const fieldNames = {
            name: 'name',
            address: 'billing address',
            city: 'city',
            shipaddr: 'shipping address',
            shipcity: 'shipping city',
            shipzip: 'shipping zip code',
            zip: 'zip code',
            email: 'email address',
            email2: 'confirmation email address'
          };

          if ($(this).val().trim() === '') {
            $('#' + this.id + 'Err').text('Please enter a ' + fieldNames[this.id] + '.');
          } else if ((this.id === 'zip' || this.id === 'shipzip') && !zipPattern.test($(this).val().trim())) {
            const zipLabel = this.id === 'shipzip' ? 'shipping zip code' : 'zip code';
            $('#' + this.id + 'Err').text('Please enter a 5-digit ' + zipLabel + '.');
          } else if (this.id === 'email' && !emailPattern.test($(this).val().trim())) {
            $('#' + this.id + 'Err').text('Please enter a valid email address.');
          } else if (this.id === 'email2' && $(this).val().trim() !== $('#email').val().trim()) {
            $('#' + this.id + 'Err').text('Email addresses do not match.');
          } else {
            $('#' + this.id + 'Err').text('');
          }
        });

        $('#copy').on('change', function () {
          if (this.checked) {
            $('#shipaddr').val($('#address').val()).trigger('blur');
            $('#shipcity').val($('#city').val()).trigger('blur');
            $('#shipzip').val($('#zip').val()).trigger('blur');
            $('#shipstate').val($('#state').val()).trigger('change');
          }
        });

        function updateOrderTotals() {
          let subtotalCents = 0;

          $('.qty').each(function () {
            const quantityText = $(this).val().trim();
            const quantity = Number(quantityText);
            const price = Number($('#price' + this.id).text());
            const totalCell = $('#total' + this.id);

            if (quantityText === '' || !Number.isFinite(quantity) || quantity < 0) {
              totalCell.text('');
              return;
            }

            const lineTotalCents = Math.round(quantity * price * 100);
            subtotalCents += lineTotalCents;
            totalCell.text((lineTotalCents / 100).toFixed(2));
          });

          $('#subt').text((subtotalCents / 100).toFixed(2));
          const shipState = $('#shipstate').val();
          const taxCents = shipState === 'TX' ? Math.round(subtotalCents * 0.08) : 0;
          let shippingCents = 1000;
          if (shipState === 'TX') {
            shippingCents = 500;
          } else if (shipState === 'CA' || shipState === 'NY') {
            shippingCents = 2000;
          }
          $('#tax').text((taxCents / 100).toFixed(2));
          $('#ship').text((shippingCents / 100).toFixed(2));
          $('#gTotal').text(((subtotalCents + taxCents + shippingCents) / 100).toFixed(2));
        }

        $('.qty').on('input', updateOrderTotals);
        $('#shipstate').on('change', updateOrderTotals);
        updateOrderTotals();
      });
    </script>

	</head>

  <body>
    <div id="container">
      <header>
        <h1>Patti's Posies</h1>
        <h2>Order Form</h2>
      </header>
      <nav>
        <p><a href="index.html">Home</a> | <a href="orderform.html">Place an Order</a> | <a href="mums.html">Mums</a> | <a href="pansy.html">Pansies</a></p>
      </nav>
      <div id="main">
        <form name="order" id="order" method="post" action="thanks.html" novalidate>
          <fieldset>
            <legend>Personal Information</legend>
            <p>
              <label for="name">Name:</label>
              <input type="text" name="name" id="name" required>
              <span id="nameErr" class="error"></span><br>

              <label for="address">Billing Address:</label>
              <input type="text" name="address" id="address" required>
              <span id="addressErr" class="error"></span><br>

              <label for="city">City:</label>
              <input type="text" name="city" id="city" required>
              <span id="cityErr" class="error"></span><br>

              <label for="state">State: </label>
              <select name="state" id="state">
                <option value="TX">Texas</option>
                <option value="OK">Oklahoma</option>
                <option value="NM">New Mexico</option>
                <option value="LA">Louisiana</option>
                <option value="AR">Arkansas</option>
                <option value="CO">Colorado</option>
                <option value="CA">California</option>
                <option value="NY">New York</option>
              </select>
              <span id="stateErr" class="error"></span><br>

              <label for="zip">Zip Code:</label>
              <input type="text" name="zip" id="zip" maxlength="5" inputmode="numeric" pattern="[0-9]{5}" required>
              <span id="zipErr" class="error"></span><br>

              <label for="email">Email:</label>
              <input type="email" name="email" id="email" required>
              <span id="emailErr" class="error"></span><br>

              <label for="email2">Confirm Email:</label>
              <input type="email" name="email2" id="email2" required>
              <span id="email2Err" class="error"></span><br>

              <!--			<label for="shipdate">Ship date:</label>
			<input type="text" name="shipdate" id="shipdate">-->
            </p>
          </fieldset>

          <fieldset>
            <legend>Shipping Address</legend>
            <p>
              <label for="copy">Copy Billing Address:</label>
              <input type="checkbox" name="copy" id="copy"><br>
              <!-- span tag to hide shipping info   -->
              <span id="shipping">

                <label for="shipaddr">Shipping Address:</label>
                <input type="text" name="shipaddr" id="shipaddr" required>
                <span id="shipaddrErr" class="error"></span><br>

                <label for="shipcity">City:</label>
                <input type="text" name="shipcity" id="shipcity" required>
                <span id="shipcityErr" class="error"></span><br>

                <label for="shipstate">State: </label>
                <select name="shipstate" id="shipstate">
                  <option value="TX">Texas</option>
                  <option value="OK">Oklahoma</option>
                  <option value="NM">New Mexico</option>
                  <option value="LA">Louisiana</option>
                  <option value="AR">Arkansas</option>
                  <option value="CO">Colorado</option>
                  <option value="CA">California</option>
                  <option value="NY">New York</option>
                </select>
                <span id="shipstateErr" class="error"></span><br>

                <label for="shipzip">Zip Code:</label>
                <input type="text" name="shipzip" id="shipzip" maxlength="5" inputmode="numeric" pattern="[0-9]{5}" required>
                <span id="shipzipErr" class="error"></span>

              </span>
            </p>
          </fieldset>

          <fieldset>
            <legend>Order Form</legend>
            <p id="orderErr" class="error"></p>
            <table>
              <tr>
                <th>Item</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
              </tr>
              <tr>
                <td>Mums</td>
                <td id="price1">9.99</td>
                <td><input type="text" size="2" name="qty1" id="1" class="qty"></td>
                <td id="total1" class="total"></td>
              </tr>
              <tr>
                <td>Pansies</td>
                <td id="price2">1.49</td>
                <td><input type="text" size="2" name="qty2" id="2" class="qty"></td>
                <td id="total2" class="total"></td>
              </tr>
              <tr>
                <td>Ornamental Kale</td>
                <td id="price3">11.99</td>
                <td><input type="text" size="2" name="qty3" id="3" class="qty"></td>
                <td id="total3" class="total"></td>
              </tr>
              <tr>
                <th colspan="3">Subtotal</th>
                <th id="subt"></th>
              </tr>
              <tr>
                <th colspan="3">Tax</th>
                <th id="tax"></th>
              </tr>
              <tr>
                <th colspan="3">Shipping</th>
                <th id="ship"></th>
              </tr>
              <tr>
                <th colspan="3">Order Total</th>
                <th id="gTotal"></th>
              </tr>
            </table>
            <p id="place"><input type="submit" name="submit" value="Place order"></p>
          </fieldset>
        </form>
        <p><a href="index.html">Home Page</a></p>
      </div>
      <footer>
				<hr>
        <p>Brookhaven College WebDev</p>
      </footer>
    </div>
  </body>

</html>
