<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret Number Guessing Game</title>
    <style>
        /* Clean and simple styling for the web page */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .game-card {
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            color: #7f8c8d;
            font-size: 1.1em;
        }
        a:hover {
            text-decoration: underline;
        }
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            nav ul {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Secret Number Guessing Game</h1>
        <p>Refresh the page if you would like to play again.</p>
    </div>

    <script>
        // 1. Create a secret number variable and assign it a value between 1 and 5
        const secretNumber = 3;
        let points = 0;
        let guess;

        // 2. Loop to repeatedly prompt the user until they enter a valid number
        while (true) {
            let userInput = prompt("Please enter your favorite number between 1 and 5:");

            // Check if the user cancelled the prompt
            if (userInput === null) {
                alert("Game cancelled. Refresh to try again.");
                break;
            }

            // Trim whitespace and convert the input to a number
            guess = Number(userInput.trim());

            // Check if the input is empty or Not-a-Number (isNaN)
            if (userInput.trim() === "" || isNaN(guess)) {
                alert("Error: That is not a number. Please enter a numerical value between 1 and 5.");
            } else {
                // Valid number received, exit the input validation loop
                break;
            }
        }

        // 3. If a valid number was entered, run the game logic comparison
        if (guess !== undefined) {
            if (guess === secretNumber) {
                // If they match, award 10 points and show a congratulatory message
                points = 10;
                alert("Congratulations! You guessed correctly! You earned " + points + " points.");  
            } else {
                // If they don't match, display an apologetic message
                points = 0;
                alert("We are so sorry. That was not the secret number. You earned " + points + " points.");
            }

            // 4. Display their final points at the end of the game with a salutation
            alert("Thank you so much for playing! Total Points: " + points + "\nHave a great day!");
        }
    </script>

</body>
</html>
